name: Verificar laboratorios
on:
  push:
    paths:
      - 'notebooks/**'
      - 'instructor/soluciones.json'
      - 'scripts/**'
      - 'requirements*.txt'
      - '.github/workflows/verificar.yml'
  pull_request:
permissions:
  contents: read
jobs:
  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/verificar.py
